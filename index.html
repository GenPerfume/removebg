<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tối ưu & Xuất Ảnh SEO Tự Động</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thư viện piexifjs xử lý EXIF Metadata -->
    <script src="https://unpkg.com/piexifjs@1.0.6/piexif.js"></script>
    <!-- Thư viện JSZip đóng gói thư mục -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6 font-sans">
    <div class="max-w-xl mx-auto bg-white rounded-xl shadow-md p-6">
        <h1 class="text-xl font-bold text-slate-800 mb-4 border-b pb-3">Tối Ưu & Xuất Ảnh Tự Động (<100KB)</h1>

        <!-- Form nhập duy nhất Title -->
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-700 mb-1">Tiêu đề ảnh (Title):</label>
            <input type="text" id="metaTitle" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Nhập tiêu đề chung cho các ảnh...">
        </div>

        <!-- Chọn File Ảnh -->
        <div class="mb-6">
            <label class="block text-sm font-semibold text-gray-700 mb-1">Chọn ảnh (Chọn nhiều ảnh cùng lúc):</label>
            <input type="file" id="imageInput" multiple accept="image/*" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
        </div>

        <!-- Nút xử lý -->
        <button id="processBtn" onclick="processImages()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow transition">
            Xử lý & Xuất thư mục ảnh (.zip)
        </button>

        <!-- Trạng thái -->
        <div id="status" class="mt-4 text-center text-sm text-slate-600 hidden"></div>
    </div>

    <script>
        // CẤU HÌNH TỰ ĐỘNG MẶC ĐỊNH (KHÔNG CHỨA GEOTAG)
        const DEFAULT_CONFIG = {
            rating: 5,                      // Mặc định 5 sao
            device: "iPhone 15 Pro Max"     // Mặc định thiết bị chụp
        };

        // Tạo dữ liệu EXIF tự động (Đã bỏ toàn bộ phần GPS)
        function createExifData(title) {
            const zeroth = {};

            if (title) zeroth[piexif.ImageIFD.ImageDescription] = title;
            zeroth[piexif.ImageIFD.Model] = DEFAULT_CONFIG.device;
            zeroth[piexif.ImageIFD.Rating] = DEFAULT_CONFIG.rating;

            const exifObj = {"0th": zeroth};
            return piexif.dump(exifObj);
        }

        // Tự động nén ép dung lượng < 100KB và ép kiểu JPG
        async function compressImageToMax100KB(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        // Thu nhỏ kích thước tối đa nếu ảnh quá lớn
                        const maxDimension = 1920;
                        if (width > maxDimension || height > maxDimension) {
                            if (width > height) {
                                height = Math.round((height * maxDimension) / width);
                                width = maxDimension;
                            } else {
                                width = Math.round((width * maxDimension) / height);
                                height = maxDimension;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        let quality = 0.9;
                        let dataUrl = canvas.toDataURL('image/jpeg', quality);

                        // Giảm chất lượng tự động tới khi file < 100KB
                        while (dataUrl.length > 137000 && quality > 0.1) {
                            quality -= 0.05;
                            dataUrl = canvas.toDataURL('image/jpeg', quality);
                        }

                        resolve(dataUrl);
                    };
                };
            });
        }

        // Tiến trình Xử lý chính
        async function processImages() {
            const fileInput = document.getElementById('imageInput');
            const files = fileInput.files;

            if (files.length === 0) {
                alert("Vui lòng chọn ít nhất 1 hình ảnh!");
                return;
            }

            const title = document.getElementById('metaTitle').value.trim();
            const statusDiv = document.getElementById('status');
            const processBtn = document.getElementById('processBtn');
            
            statusDiv.classList.remove('hidden');
            processBtn.disabled = true;
            processBtn.classList.add('opacity-50');

            const zip = new JSZip();
            const folderName = "Thu_Muc_Anh_Toi_Uu";
            const folder = zip.folder(folderName);

            // Tạo chuỗi EXIF tự động
            const exifBytes = createExifData(title);

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                statusDiv.innerText = `⏳ Đang xử lý ảnh (${i + 1}/${files.length}): ${file.name}...`;

                // 1. Nén ảnh ép chuẩn JPG & < 100KB
                let jpegDataUrl = await compressImageToMax100KB(file);

                // 2. Chèn Metadata tự động
                try {
                    jpegDataUrl = piexif.insert(exifBytes, jpegDataUrl);
                } catch (e) {
                    console.error("Lỗi đính kèm EXIF:", e);
                }

                // 3. Giữ nguyên tên file gốc và ép đuôi .jpg
                let originalName = file.name;
                const lastDotPosition = originalName.lastIndexOf('.');
                if (lastDotPosition !== -1) {
                    originalName = originalName.substring(0, lastDotPosition);
                }
                const newFileName = `${originalName}.jpg`;

                // 4. Thêm vào ZIP
                const base64Data = jpegDataUrl.replace(/^data:image\/jpeg;base64,/, "");
                folder.file(newFileName, base64Data, {base64: true});
            }

            statusDiv.innerText = "📦 Đang nén thành thư mục ZIP...";
            
            // 5. Tải file ZIP về máy
            zip.generateAsync({type:"blob"}).then(function(content) {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = `${folderName}.zip`;
                link.click();

                statusDiv.innerText = "✅ Hoàn tất! Thư mục ảnh đã tự động tải về.";
                processBtn.disabled = false;
                processBtn.classList.remove('opacity-50');
            });
        }
    </script>
</body>
</html>
